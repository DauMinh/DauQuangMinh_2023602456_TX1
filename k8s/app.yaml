apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop-management
  labels:
    app: shop-management
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shop-management
  template:
    metadata:
      labels:
        app: shop-management
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8081"
    spec:
      containers:
        - name: shop-management
          image: shop-management:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8081
          env:
            - name: DB_URL
              value: jdbc:mysql://mysql:3306/shop_management?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
            - name: DB_USERNAME
              value: shop_user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shop-db-secret
                  key: db-password
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            initialDelaySeconds: 45
            periodSeconds: 20
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: shop-management
  labels:
    app: shop-management
spec:
  type: NodePort
  selector:
    app: shop-management
  ports:
    - name: http
      port: 8081
      targetPort: 8081
      nodePort: 30081
